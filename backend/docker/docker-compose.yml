services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: iotdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      
    ports:
      - "5432:5432"
        
    volumes:
      - timescale_data:/var/lib/postgresql/data
        
volumes:
  timescale_data:
