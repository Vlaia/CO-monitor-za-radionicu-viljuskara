# Mosquitto 2 bez ovog fajla slusa samo na localhost-u, pa uredjaj ne bi mogao da se poveze.
listener 1883 0.0.0.0

# Za razvoj u lokalnoj mrezi. Za stvarnu upotrebu ukljuciti lozinke (password_file).
allow_anonymous true

# Cuva retained poruke (status uredjaja) i sesije preko restarta brokera.
persistence true
persistence_location /mosquitto/data/
